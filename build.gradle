plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        diversitycore_verification {
            sourceSet(sourceSets.verification)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Run energy transfer integration tests in a real headless server.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.verification
            loadedMods = [mods."${mod_id}", mods.diversitycore_verification]
            gameDirectory = layout.buildDirectory.dir('power-bank-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'diversitycore_verification'
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        apiVerification {
            serverData()
            sourceSet = sourceSets.verification
            loadedMods = [mods."${mod_id}", mods.diversitycore_verification]
            gameDirectory = layout.buildDirectory.dir('verification-run')
            programArguments.addAll '--mod', 'diversitycore_verification', '--all', '--output', layout.buildDirectory.dir('verification-data').get().asFile.absolutePath
            disableIdeRun()
        }

        cropRenderVerification {
            client()
            sourceSet = sourceSets.verification
            loadedMods = [mods.diversitycore, mods.diversitycore_verification]
            gameDirectory = layout.buildDirectory.dir('crop-render-run')
            systemProperty 'diversitycore.verifyCropRendering', 'true'
            programArguments.addAll '--width', '640', '--height', '480'
            disableIdeRun()
        }

        cropDataVerification {
            clientData()
            sourceSet = sourceSets.verification
            loadedMods = [mods.diversitycore, mods.diversitycore_verification]
            gameDirectory = layout.buildDirectory.dir('crop-client-data-run')
            programArguments.addAll '--mod', 'diversitycore_verification', '--all', '--output', layout.buildDirectory.dir('crop-verification-data').get().asFile.absolutePath
            disableIdeRun()
        }

        // applies to all the run configs above
        configureEach {
            // Test fixtures are loaded only by explicit verification runs.
            loadedMods.convention([mods."${mod_id}"])
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Run contract checks inside the real dedicated-server loader; no window or EULA is needed.
def verificationLootDirectory = layout.buildDirectory.dir('verification-data/data/diversitycore_verification/loot_table/blocks')
def verificationDataDirectory = layout.buildDirectory.dir('verification-data/data')
tasks.register('verifyContentApi') {
    group = 'verification'
    description = 'Verifies content declaration lifecycle, ID conflicts and resource metadata.'
    dependsOn tasks.named('runApiVerification')
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def lootDirectory = verificationLootDirectory.get().asFile
        def cube = parser.parse(new File(lootDirectory, 'cube.json'))
        def hidden = parser.parse(new File(lootDirectory, 'hidden.json'))
        assert cube.pools[0].entries[0].name == 'diversitycore_verification:cube'
        assert !hidden.containsKey('pools'): 'noItem blocks must not drop a nonexistent item'
        def dataDirectory = verificationDataDirectory.get().asFile
        def verifyTag = { String namespace, String registry, String path, List expected ->
            def tag = parser.parse(new File(dataDirectory, "${namespace}/tags/${registry}/${path}.json"))
            assert tag.replace != true: 'Generated tags must append to existing data packs'
            assert tag.values.size() == expected.size(): 'Repeated tag declarations must be deduplicated'
            assert tag.values.toSet() == expected.toSet(): 'Generated tag members must match their registry'
        }
        verifyTag('diversitycore_verification', 'item', 'item_only',
                ['diversitycore_verification:custom_item', 'diversitycore_verification:cube'])
        verifyTag('diversitycore_verification', 'block', 'block_only',
                ['diversitycore_verification:cube', 'diversitycore_verification:hidden'])
        verifyTag('diversitycore_verification', 'item', 'both', ['diversitycore_verification:cube'])
        verifyTag('diversitycore_verification', 'block', 'both', ['diversitycore_verification:cube'])
        verifyTag('c', 'item', 'verification/shared',
                ['diversitycore_verification:custom_item', 'diversitycore_verification:cube'])
        verifyTag('c', 'block', 'verification/shared', ['diversitycore_verification:cube'])
        assert !new File(dataDirectory, 'diversitycore_verification/tags/block/item_only.json').exists()
        assert !new File(dataDirectory, 'diversitycore_verification/tags/item/block_only.json').exists()
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('check') {
    dependsOn tasks.named('verifyContentApi')
    dependsOn tasks.named('runGameTestServer')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Keep fixture data staging outside sourceSets to avoid a datagen/resources dependency cycle.
tasks.register('stageCropVerificationData', Copy) {
    dependsOn tasks.named('verifyContentApi'), tasks.named('processVerificationResources')
    from(layout.buildDirectory.dir('verification-data')) { include 'data/**' }
    into(layout.buildDirectory.dir('resources/verification'))
}
tasks.named('runGameTestServer') {
    dependsOn tasks.named('stageCropVerificationData')
}

def cropResourceDirectory = layout.buildDirectory.dir('crop-verification-data')
tasks.register('verifyCropResources') {
    group = 'verification'
    description = 'Verifies crop models, item models, translations and stage coverage.'
    dependsOn tasks.named('runCropDataVerification')
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def fixtureRoot = cropResourceDirectory.get().asFile
        def json = { String path -> parser.parse(new File(fixtureRoot, path)) }
        def assets = 'assets/diversitycore_verification/'
        ['crop_single', 'crop_tall', 'crop_water', 'crop_rice', 'crop_maximum'].each { name ->
            assert json(assets + 'blockstates/' + name + '.json').variants
            assert json(assets + 'items/' + name + '.json').model
            assert json('data/diversitycore_verification/loot_table/block/' + name + '.json').pools
        }
        assert json(assets + 'blockstates/crop_single.json').variants.size() == 8
        assert json(assets + 'blockstates/crop_maximum.json').variants.size() == 16
        assert json(assets + 'blockstates/crop_rice_top.json').variants.size() == 4
        assert json(assets + 'blockstates/crop_tall_top.json').variants.size() == 1
        assert json(assets + 'models/block/crop_single_stage0.json').parent == 'minecraft:block/crop'
        assert json(assets + 'models/item/crop_single_seeds.json').parent == 'minecraft:item/generated'
        assert json(assets + 'lang/zh_cn.json')['block.diversitycore_verification.crop_rice'] == '作物测试'
        assert !new File(fixtureRoot, assets + 'items/crop_rice_seeds.json').exists()
        assert !new File(fixtureRoot, assets + 'items/crop_external_seed.json').exists()
        assert !new File(fixtureRoot, 'assets/minecraft/items/wheat.json').exists()
    }
}

tasks.named('runCropDataVerification') {
    mustRunAfter tasks.named('stageCropVerificationData')
}

tasks.register('stageCropClientResources', Copy) {
    dependsOn tasks.named('stageCropVerificationData'), tasks.named('verifyCropResources')
    mustRunAfter tasks.named('runGameTestServer')
    from(layout.buildDirectory.dir('crop-verification-data/assets'))
    into(layout.buildDirectory.dir('resources/verification/assets'))
}
tasks.named('runCropRenderVerification') {
    dependsOn tasks.named('stageCropClientResources')
}

tasks.named('check') {
    dependsOn tasks.named('verifyCropResources')
}

// Recipe fixtures and codec round trips run in the isolated server-data loader.
tasks.register('verifyRecipeApi') {
    group = 'verification'
    description = 'Verifies recipe declarations, generated JSON, unlocking and native codecs.'
    dependsOn tasks.named('runApiVerification')
}
tasks.named('check') {
    dependsOn tasks.named('verifyRecipeApi')
}
